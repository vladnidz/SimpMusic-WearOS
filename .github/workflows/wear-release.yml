name: Build and Release Wear APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Build Wear debug APK
        run: ./gradlew :wearApp:assembleDebug

      - name: Rename and Prepare APK
        run: |
          mkdir -p release-output
          cp wearApp/build/outputs/apk/debug/*.apk release-output/SimpMusic-Watch-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0-watch
          name: "SimpMusic WearOS for Huawei Watch 3 Pro"
          body: |
            ### SimpMusic WearOS Edition for Huawei Watch 3 Pro
            - **Round AMOLED UI (466x466)**: built with Wear Compose Material 3.
            - **Rotary Crown Support**: use the physical rotating knob to scroll lists and search results.
            - **Quick Download Button**: save YouTube Music tracks directly to watch storage for offline listening.
            - **Offline Mode**: dedicated Downloads screen for playback without phone or internet.
            - **Standalone Wi-Fi & Bluetooth**: streams over Wi-Fi and connects directly to Bluetooth earbuds.
          files: release-output/SimpMusic-Watch-debug.apk
